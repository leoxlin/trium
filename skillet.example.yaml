# yaml-language-server: $schema=./skillet.schema.yaml
version: 1

target:
  - agent: codex
    # Optional: override CODEX_HOME or the default ~/.codex target.
    # path: ~/.codex-team
  - agent: kimi

skills:
  - name: code-review
    source: local
    path: skills/code-review
  - name: team-workflows
    source: leoxlin/skillets
    path: skills/team-workflows
    ref: main

plugins:
  - name: team-tools
    source: local
    path: plugins/team-tools

mcps:
  - name: filesystem
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - .
    cwd: .
  - name: internal-docs
    url: https://mcp.example.com/mcp
    headers:
      X-Client: skillet-example
    bearer_token_env: INTERNAL_DOCS_TOKEN
