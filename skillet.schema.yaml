$schema: https://json-schema.org/draft/2020-12/schema
title: Skillet manifest
description: Schema for a version 1 skillet.yaml file.
type: object
additionalProperties: false
required:
  - version
  - target
properties:
  version:
    type: integer
    const: 1
  target:
    oneOf:
      - $ref: '#/$defs/target'
      - type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/target'
  skills:
    type: array
    items:
      $ref: '#/$defs/bundle'
    default: []
  plugins:
    type: array
    items:
      $ref: '#/$defs/bundle'
    default: []
  mcps:
    type: array
    items:
      $ref: '#/$defs/mcp'
    default: []
$defs:
  target:
    type: object
    additionalProperties: false
    required:
      - agent
    properties:
      agent:
        type: string
        enum:
          - codex
          - claude
          - kimi
      path:
        type: string
        minLength: 1
        pattern: '^(?:/|~/|[A-Za-z]:[\\/])[^\\\x00-\x1F\x7F-\x9F]*$'
        $comment: >-
          Optional absolute agent-home path, or a path beginning with ~/. When omitted, the agent-specific environment
          variable and then ~/.codex, ~/.claude, or ~/.kimi-code determines the target.
  name:
    type: string
    pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
  source:
    type: string
    minLength: 1
    pattern: '^[^-\x00-\x1F\x7F-\x9F][^\x00-\x1F\x7F-\x9F]*$'
    anyOf:
      - const: local
      - pattern: '^(?:git:)?(?:git\+)?(?:https?|ssh|git)://[^/\s]+'
      - pattern: '^(?:github:|github\.com/)?[A-Za-z0-9_-][A-Za-z0-9_.-]*/[A-Za-z0-9_-][A-Za-z0-9_.-]*$'
      - pattern: '^(?:git:)?(?:[^/@:\s]+@)?(?!git:|github:|file:)[^/:\s]+:[^:\s]+$'
    $comment: >-
      The value local, a Git URL, github:owner/repo, github.com/owner/repo, or owner/repo shorthand.
      With source local or omitted, path selects a local skill or plugin bundle; otherwise path selects a directory
      in the repository.
  repositoryPath:
    type: string
    minLength: 1
    pattern: '^[^\\\x00-\x1F\x7F-\x9F]+$'
    not:
      pattern: '^(?:/|[A-Za-z]:)'
    $comment: The loader enforces containment within the manifest directory or selected repository and rejects symlinks.
  bundle:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        $ref: '#/$defs/name'
      source:
        $ref: '#/$defs/source'
      path:
        $ref: '#/$defs/repositoryPath'
      ref:
        type: string
        pattern: '^[^\s\x00-\x1F\x7F-\x9F]+$'
    oneOf:
      - title: Local bundle
        required:
          - path
        properties:
          source:
            const: local
        not:
          required:
            - ref
      - title: Repository bundle
        required:
          - source
        properties:
          source:
            not:
              const: local
  mcp:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        $ref: '#/$defs/name'
      command:
        type: string
        minLength: 1
      args:
        type: array
        items:
          type: string
        default: []
      env:
        type: object
        propertyNames:
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        additionalProperties:
          type: string
        default: {}
      cwd:
        type: string
        minLength: 1
        description: Working directory; relative to the manifest directory. Unsupported for Claude targets.
      url:
        type: string
        format: uri
        pattern: '^https?://'
      headers:
        type: object
        propertyNames:
          pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
        additionalProperties:
          type: string
          pattern: '^[^\x00-\x1F\x7F-\x9F]*$'
        default: {}
      bearer_token_env:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        description: Token environment variable name; cannot accompany an Authorization header (case-insensitive).
    oneOf:
      - title: Stdio server
        required:
          - command
        not:
          anyOf:
            - required:
                - url
            - required:
                - headers
            - required:
                - bearer_token_env
      - title: Streamable HTTP server
        required:
          - url
        not:
          anyOf:
            - required:
                - command
            - required:
                - args
            - required:
                - env
            - required:
                - cwd
$comment: >-
  Strict YAML decoding must reject duplicate mapping keys. Loader validation must reject duplicate names within each
  resource class and enforce path containment, symlink restrictions, and acquired-content requirements.
